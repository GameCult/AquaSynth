boundaries:
  leave_in_rust:
    - sample renderer
    - PatchPlayer runtime
    - realtime AudioUnit bridge
    - experimental Rust DSL compiler branch
  own_in_csharp:
    - patch graph contracts
    - patch script surface
    - SFXR parameter mapping and atoms
    - analysis and comparison tools
    - script scoring
    - Faust source generation in AquaSynth.Core
    - target-code generation, compile-product contracts, dynamic patch compilation policy, cache identity, generated artifact manifests, and Faust toolchain selection in AquaSynth.Faust
    - live patch compilation, native Faust factory lifetime, and offline sample-buffer render proof in AquaSynth.Faust
    - AquaSynth daemon command ownership for patch.compile, instrument.sample, bounded instrument.stream automation, and live instrument.open/instrument.control/instrument.block sessions: compile/session/render/stream/live/operator typed receipts, requested-duration sample renders, persistent native streaming patch instances for live controls, CultMesh-compatible audio/control stream descriptors, per-block .f32 packet artifacts, JSON-lines local transport through tools/AquaSynthDaemon, and a local CultNet host/database that watches typed command documents and publishes typed receipt/provider documents without becoming a second render/session authority
    - IPA-to-phonetic-feature planning, articulatory gesture planning, and human/alien vocal-tract roadmap design
    - phonetic intent, articulatory plan, morphology capability, and constraint-report contracts for vocal tract synthesis
    - packed-buffer native backprop/Adam as the shared AquaSynth gradient-descent primitive
    - learned utterance embedding encoder from speech text embeddings, prosody/emphasis hints, and Ghostlight/Epiphany-shaped character state vectors
    - learned phonetic-plus-utterance-embedding synth driver with packed-buffer native backprop/Adam for tract, AM/FM, LFO, filter, and mel spectral-envelope controls
    - chained utterance-embedding-to-synth-driver backpropagation that returns synth input gradients and updates the utterance encoder from downstream speech loss
    - external-gradient speech backpropagation entry point for rendered loss surfaces
    - distributed speech render request/result/checkpoint CultCache contracts for multi-machine Faust rendering and local backpropagation
    - extracted primitive timeline facts embedded in IPA trial-result CultCache records for contact release, source flow, branch admittance, radiation output, path energy, and passivity evidence
    - CultMesh speech render/scoring worker orchestration with payload manifests, peer/lease admission receipts, worker assignment, result collection, and central checkpoint application; workers return gradients and receipts, while one authority trainer owns optimizer updates and checkpoint commits
    - optional eSpeak NG generated ground-truth fixture for supervised utterance-embedding and synth-driver gradient descent
    - Faust-rendered speech loss surface in AquaSynth.Faust, using rendered audio analysis and finite-difference controller-output gradients
    - compiled native Faust speech-loss surface with exported /speech/output/N controls for batch candidate rendering without recompiling DSP
    - utterance parity curriculum research and docs for structured metadata -> utterance embedding -> synth automation -> rendered speech loss
    - typed CultCache sound-claim document distributed as a real .cc MessagePack-backed CultCache store via CultLib, bundling the patch database with fixture-backed patch claim cards and speech-lane claim cards
  dev_only:
    - public-domain DX7 SysEx fixtures
    - pinned GPL ZynAddSubFX source for parity tests
    - project-authored ZynAddSubFX .xiz fixtures
    - dexed-py reference renderer
    - structured .aqua patch library
checks:
  default: dotnet test
  core_package: dotnet pack src/AquaSynth.Core/AquaSynth.Core.csproj -c Release
  faust_package: dotnet pack src/AquaSynth.Faust/AquaSynth.Faust.csproj -c Release
  faust_validation: automatic in tests when Faust is installed
  dexed_py_reference: optional in tests when AQUASYNTH_DX7_PYTHON or a Python with dexed-py is available
  zyn_reference_source: pinned submodule used only for parity tests; never package content
  pink_trombone_reference_source: pinned MIT submodule used only for parity renderer source audits and port verification; never package content
  espeak_ng_reference: optional command-line development reference, found through ESPEAK_NG or PATH; never package content
  zyn_upstream_instrument_bank: nested GPL submodule used only for test/development pressure surveys and oracle renders; never package content

